<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <title>Home | FraGenesis</title>

    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="./assets/css/colors.css" />
    <link rel="stylesheet" href="./assets/css/breadcrumbs.css" />
    <link rel="stylesheet" href="./assets/css/dropdown.css" />

    <script type="module" src="home.js"></script>
    <script src="./assets/js/dropdown.js"></script>
    <script src="./db/syllabus.js"></script>
  </head>
  <body>
    <header>
      <button type="button">+2 Computer Science</button>
      <section class="menu">
        <span>
          <a href="/about" target="_blank">About</a>
        </span>

        <span class="dropdown">
          <button type="button">Grade</button>
          <dialog class="dropdown-content">
            <ul>
              <li>
                <label title="Class 12">
                  <input type="radio" name="grade" value="12" checked />
                  Twelve [XII]
                </label>
              </li>
              <li>
                <label title="Class 11">
                  <input type="radio" name="grade" value="11" />
                  Eleven [XI]
                </label>
              </li>
            </ul>
          </dialog>
        </span>

        <span class="dropdown">
          <button type="button">Type of Test</button>
          <dialog class="dropdown-content">
            <ul>
              <li>
                <label title="Weekly Test">
                  <input type="radio" name="fullMarks" value="20" checked />
                  Unit [20 marks]
                </label>
              </li>
              <li>
                <label title="Monthly Test">
                  <input type="radio" name="fullMarks" value="30" />
                  Internal [30 marks]
                </label>
              </li>
              <li>
                <label title="Quarterly Exam">
                  <input type="radio" name="fullMarks" value="50" />
                  Terminal [50 marks]
                </label>
              </li>
              <li>
                <label title="Quarterly Exam" id="final_exam">
                  <input type="radio" name="fullMarks" value="50" />
                  Final [50 marks]
                </label>
              </li>
            </ul>
          </dialog>
        </span>

        <span id="list_of_units" class="dropdown">
          <button type="button">Units</button>
          <dialog class="dropdown-content">
            <!-- units will be generated by JS -->
          </dialog>
        </span>
      </section>
    </header>

    <nav>
      <!-- breadcrumbs will be generated by JS -->
    </nav>

    <form>
      <main>
        <!-- topics will be generated by JS -->
      </main>
      <footer>
        <input type="submit" value="Generate" id="generate" />
      </footer>
    </form>
  </body>
</html>
